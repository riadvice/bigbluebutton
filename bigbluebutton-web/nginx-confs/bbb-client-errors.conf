# Rate limits of /bigbluebutton/client-errors/ (see /usr/share/bigbluebutton/nginx/web).
# Per HTML5 session token; reports without one (playback, dashboard) are only limited per address.
limit_req_zone $arg_sessionToken zone=bbb_client_errors_session:10m rate=1r/s;
# Per address: generous, a whole school can come from one address.
limit_req_zone $binary_remote_addr zone=bbb_client_errors_addr:10m rate=5r/s;
